specVersion: "3.1"
metadata:
  name: sapui5task2
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /V2/OData/OData.svc
            metadataPath: ./webapp/localService/metadataV2.xml
            mockdataPath: ./webapp/localService/dataV2
            generateMockData: true
          - urlPath: /V4/OData/OData.svc
            metadataPath: ./webapp/localService/metadataV4.xml
            mockdataPath: ./webapp/localService/dataV4
            generateMockData: true
        annotations: []